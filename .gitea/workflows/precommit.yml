          raw = f"{server}/api/v1/repos/{repo}/raw/scripts/ci_artifact.py?ref={sha}"
          contents = f"{server}/api/v1/repos/{repo}/contents/scripts/ci_artifact.py?ref={sha}"
          script = None
          try:
