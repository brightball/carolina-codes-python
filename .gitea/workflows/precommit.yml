          tar -xzf prepared-env.tar.gz
          cp -f .ci-bin/uv /usr/local/bin/uv
          cp -f .ci-bin/gitleaks /usr/local/bin/gitleaks
          chmod +x /usr/local/bin/uv /usr/local/bin/gitleaks
      - run: uv export --frozen --no-dev --no-hashes -o .requirements-audit.txt
      - run: uv run pip-audit -r .requirements-audit.txt --progress-spinner off

  gitleaks:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/python:3.12-bookworm
