          cp -f .ci-bin/uv /usr/local/bin/uv
          cp -f .ci-bin/gitleaks /usr/local/bin/gitleaks
          chmod +x /usr/local/bin/uv /usr/local/bin/gitleaks
      - run: uv run bandit -c pyproject.toml -r app.py scripts

  pip-audit:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/python:3.12-bookworm
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
